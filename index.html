<!doctype html>
<!-- 拆开看 — summer 的博客。无依赖、无构建：改完直接推，推完直接生效。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆开看 · summer 的博客</title>
<meta name="description" content="把值得研究的拆开看，把用得上的留下来。Agent Skills、AI 图像与视频、本地优先的数据、旅行资料——每篇都是一份拆开看的报告。">
<meta property="og:title" content="拆开看 · summer 的博客">
<meta property="og:description" content="把值得研究的拆开看，把用得上的留下来。">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
/* ═══════════ 基础 ═══════════ */
:root{
  --bg:#FAF9F6; --ink:#1F2328; --soft:#4A545E; --sub:#7A828C;
  --line:#E6E4DE; --card:#FFFFFF; --code-bg:#F3F1EC;
  --acc:#D9480F; --acc-ink:#B33A0A;
  --serif:'Display','Songti SC','STSong','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
html[data-theme="dark"]{
  --bg:#0D1117; --ink:#E6EDF3; --soft:#B6C2CF; --sub:#8B96A3;
  --line:#262D36; --card:#10161D; --code-bg:#161D24;
  --acc:#FFA94D; --acc-ink:#FFA94D;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.8;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* 主题切换的过渡只在首帧之后启用：避免加载时从浅色值开始做动画 */
html.theme-anim body{transition:background .25s ease,color .25s ease}
html.theme-anim .item h2{transition:color .15s}
::selection{background:var(--acc); color:#fff}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc); outline-offset:3px; border-radius:2px}
.wrap{max-width:720px; margin:0 auto; padding:0 24px}
@media(max-width:600px){.wrap{padding:0 18px}}

/* ═══════════ 顶栏 ═══════════ */
header.top{border-bottom:1px solid var(--line)}
.top-in{max-width:720px; margin:0 auto; padding:18px 24px; display:flex; align-items:baseline; justify-content:space-between}
.brand{font-family:var(--serif); font-weight:900; font-size:19px; text-decoration:none; letter-spacing:.04em}
.brand small{font-family:var(--mono); font-weight:400; font-size:10.5px; color:var(--sub); letter-spacing:.14em; margin-left:10px; text-decoration:none}
#theme{background:none; border:1px solid var(--line); border-radius:20px; width:34px; height:34px;
  cursor:pointer; color:var(--sub); display:grid; place-items:center; transition:color .2s,border-color .2s; align-self:center}
#theme:hover{color:var(--acc); border-color:var(--acc)}
#theme svg{width:16px; height:16px; display:block}

/* ═══════════ 首页 ═══════════ */
.hero{padding:72px 0 8px}
.kicker{font-family:var(--mono); font-size:12px; letter-spacing:.22em; color:var(--acc-ink); margin:0 0 22px; display:flex; align-items:center; gap:10px}
.kicker::before{content:""; width:22px; height:5px; background:var(--acc)}
h1.display{
  font-family:var(--serif); font-weight:900; font-size:clamp(24px,8vw,54px);
  line-height:1.32; letter-spacing:.015em; margin:0 0 26px;
}
h1.display em{font-style:normal; color:var(--acc)}
.lede{color:var(--soft); font-size:16.5px; max-width:34em; margin:0 0 14px}
.meta-line{font-family:var(--mono); font-size:12px; color:var(--sub); letter-spacing:.06em}
.meta-line b{color:var(--acc-ink); font-weight:600}

.arch-head{margin:64px 0 0; padding:22px 0 4px; border-top:1px solid var(--line);
  font-family:var(--mono); font-size:12px; letter-spacing:.22em; color:var(--sub); display:flex; justify-content:space-between}

.item{border-bottom:1px solid var(--line)}
.item a{display:block; padding:30px 0 32px; text-decoration:none; outline-offset:-2px}
.item-top{display:flex; align-items:baseline; gap:14px; font-family:var(--mono); font-size:12px; letter-spacing:.05em}
.item .no{color:var(--acc-ink); font-weight:700; min-width:52px}
.item time{color:var(--sub)}
.item .tags{color:var(--sub); margin-left:auto; text-align:right}
.item h2{
  font-family:var(--serif); font-weight:900; font-size:23px; line-height:1.45;
  margin:10px 0 8px; letter-spacing:.02em;
}
.item a:hover h2{color:var(--acc)}
.item .sum{margin:0; color:var(--soft); font-size:14.5px; max-width:36em}
.item-more{display:block; text-align:center; padding:26px 0 10px; color:var(--sub); font-size:13px}

/* ═══════════ 文章页 ═══════════ */
.post-head{padding:64px 0 10px}
.backlink{font-family:var(--mono); font-size:12.5px; color:var(--sub); text-decoration:none; display:inline-flex; gap:6px}
.backlink:hover{color:var(--acc)}
.post-meta{margin:26px 0 10px; display:flex; align-items:baseline; gap:14px; font-family:var(--mono); font-size:12px; letter-spacing:.05em}
.post-meta .no{color:var(--acc-ink); font-weight:700}
.post-meta time,.post-meta .tags{color:var(--sub)}
h1.title{font-family:var(--serif); font-weight:900; font-size:clamp(28px,5.6vw,40px); line-height:1.4; letter-spacing:.02em; margin:0 0 14px}
.post-rule{border:0; border-top:1px solid var(--line); margin:26px 0 0}
article.post{padding:38px 0 10px; font-size:16.5px; color:var(--ink)}
article.post p{margin:0 0 1.25em; line-height:2.0}
article.post h2{
  font-family:var(--serif); font-weight:900; font-size:22px; letter-spacing:.02em;
  margin:2.2em 0 .9em; line-height:1.5; position:relative; padding-left:16px;
}
article.post h2::before{content:""; position:absolute; left:0; top:.28em; width:5px; height:1em; background:var(--acc)}
article.post h3{font-weight:700; font-size:17.5px; margin:1.8em 0 .7em}
article.post a{color:var(--acc-ink); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
article.post a:hover{color:var(--acc)}
article.post blockquote{margin:1.4em 0; padding:2px 0 2px 18px; border-left:3px solid var(--acc); color:var(--soft)}
article.post blockquote p{margin:.4em 0}
article.post code{
  font-family:var(--mono); font-size:.86em; background:var(--code-bg);
  padding:.15em .45em; border-radius:5px;
}
article.post pre{background:var(--code-bg); border:1px solid var(--line); border-radius:10px;
  padding:18px 20px; overflow-x:auto; margin:1.5em 0; line-height:1.75}
article.post pre code{background:none; padding:0; font-size:13px; line-height:1.75}
article.post ul,article.post ol{padding-left:1.4em; margin:0 0 1.25em}
article.post li{margin:.35em 0; line-height:1.95}
article.post img{max-width:100%; border-radius:8px}
article.post table{border-collapse:collapse; width:100%; margin:1.4em 0; font-size:14.5px}
article.post th,article.post td{border:1px solid var(--line); padding:8px 12px; text-align:left}
article.post th{background:var(--code-bg); font-weight:600}
article.post hr{border:0; border-top:1px solid var(--line); margin:2.4em auto; width:120px}

.post-foot{border-top:1px solid var(--line); margin-top:40px; padding:24px 0 60px;
  display:flex; justify-content:space-between; gap:12px}
.post-foot a{font-size:13.5px; color:var(--soft); text-decoration:none}
.post-foot a:hover{color:var(--acc)}
.empty-note{color:var(--sub); padding:60px 0; text-align:center}

/* ═══════════ 页脚 & 进度 ═══════════ */
footer.site{border-top:1px solid var(--line); margin-top:30px}
.foot-in{max-width:720px; margin:0 auto; padding:26px 24px 42px;
  display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
  color:var(--sub); font-size:12.5px}
.foot-in a{color:var(--sub)}
.foot-in a:hover{color:var(--acc)}
#progress{position:fixed; top:0; left:0; height:2px; width:0; background:var(--acc); z-index:9; transition:width .1s linear}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">拆开看<small>SHIWANJUN.GITHUB.IO</small></a>
    <button id="theme" aria-label="切换明暗主题" title="切换明暗主题">
      <svg id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="foot-in">
    <span>© 2026 summer · 把值得研究的拆开看，把用得上的留下来</span>
    <span><a href="https://github.com/shiwanjun" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="https://github.com/shiwanjun/shiwanjun.github.io" target="_blank" rel="noopener noreferrer">本站源码</a> · 无依赖 · 无构建</span>
  </div>
</footer>

<script src="vendor/marked.min.js"></script>
<script src="posts.js"></script>
<script>
/* ── 主题：默认跟系统，手动切换后记住；?theme=dark|light 可强制（分享/验收用）── */
(function(){
  var q = new URLSearchParams(location.search).get('theme');
  var saved = localStorage.getItem('ckk-theme');
  var apply = function(t){
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('ic-moon').style.display = t==='dark' ? 'none' : 'block';
    document.getElementById('ic-sun').style.display  = t==='dark' ? 'block' : 'none';
  };
  var current = function(){ return document.documentElement.getAttribute('data-theme'); };
  var initial = q || saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  apply(initial);
  addEventListener('load', function(){
    requestAnimationFrame(function(){ document.documentElement.classList.add('theme-anim'); });
  });
  document.getElementById('theme').addEventListener('click', function(){
    var t = current()==='dark' ? 'light' : 'dark';
    localStorage.setItem('ckk-theme', t); apply(t);
  });
})();

/* ── 渲染 ── */
var app = document.getElementById('app');
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function noOf(i){ return 'No.' + String(POSTS.length - i).padStart(2,'0'); }

function renderHome(){
  document.title = '拆开看 · summer 的博客';
  var newest = POSTS.length ? POSTS[0].date : '';
  var items = POSTS.map(function(p, i){
    return '<article class="item"><a href="#/post/' + esc(p.slug) + '">'
      + '<div class="item-top"><span class="no">' + noOf(i) + '</span><time>' + esc(p.date) + '</time>'
      + '<span class="tags">' + esc((p.tags||[]).join(' · ')) + '</span></div>'
      + '<h2>' + esc(p.title) + '</h2><p class="sum">' + esc(p.summary) + '</p></a></article>';
  }).join('');
  app.innerHTML =
    '<div class="wrap">'
    + '<section class="hero">'
    +   '<p class="kicker">拆解记录 · SINCE 2026</p>'
    +   '<h1 class="display">把值得研究的，拆开看；<br>把用得上的，<em>留下来</em>。</h1>'
    +   '<p class="lede">这里放拆解的记录：Agent Skills、AI 图像与视频、本地优先的数据、旅行资料——每篇都是一份拆开看的报告。</p>'
    +   '<p class="meta-line"><b>' + POSTS.length + '</b> 份报告 · 更新于 ' + newest + '</p>'
    + '</section>'
    + '<div class="arch-head"><span>全部报告 / ARCHIVE</span><span>01–' + String(POSTS.length).padStart(2,'0') + '</span></div>'
    + items
    + '</div>';
}

function renderPost(slug){
  var i = POSTS.findIndex(function(p){ return p.slug === slug; });
  if (i < 0){ renderHome(); return; }
  var p = POSTS[i];
  document.title = p.title + ' · 拆开看';
  app.innerHTML =
    '<div class="wrap">'
    + '<div class="post-head"><a class="backlink" href="#/">← 全部报告</a>'
    + '<div class="post-meta"><span class="no">' + noOf(i) + '</span><time>' + esc(p.date) + '</time>'
    + '<span class="tags">' + esc((p.tags||[]).join(' · ')) + '</span></div>'
    + '<h1 class="title">' + esc(p.title) + '</h1><hr class="post-rule"></div>'
    + '<article class="post" id="post-body"><p class="empty-note">正在取回报告…</p></article>'
    + '<div class="post-foot">'
    + (POSTS[i+1] ? '<a href="#/post/' + esc(POSTS[i+1].slug) + '">← ' + esc(POSTS[i+1].title) + '</a>' : '<span></span>')
    + (i > 0 ? '<a href="#/post/' + esc(POSTS[i-1].slug) + '">' + esc(POSTS[i-1].title) + ' →</a>' : '<span></span>')
    + '</div></div>';
  fetch(p.file).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(md){
      var body = document.getElementById('post-body');
      if (!body) return;
      body.innerHTML = marked.parse(md);
      body.querySelectorAll('a[href^="http"]').forEach(function(a){
        a.target = '_blank'; a.rel = 'noopener noreferrer';
      });
      var used = {};
      body.querySelectorAll('h2').forEach(function(h){
        var id = h.textContent.trim().replace(/\s+/g,'-');
        if (used[id]) id += '-' + (++used[id]); else used[id] = 1;
        h.id = id;
      });
      progress();
    })
    .catch(function(){
      var body = document.getElementById('post-body');
      if (body) body.innerHTML = '<p class="empty-note">报告取回失败——确认 ' + esc(p.file) + ' 存在后刷新。</p>';
    });
}

function route(){
  var m = location.hash.match(/^#\/post\/(.+)$/);
  if (m) renderPost(decodeURIComponent(m[1])); else renderHome();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ── 阅读进度条（仅文章页）── */
var bar = document.getElementById('progress');
function progress(){
  var on = location.hash.indexOf('#/post/') === 0;
  bar.style.width = on ? '0%' : '0';
  if (!on) return;
  var tick = function(){
    if (location.hash.indexOf('#/post/') !== 0){ removeEventListener('scroll', tick); bar.style.width='0'; return; }
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  };
  removeEventListener('scroll', tick);
  addEventListener('scroll', tick, {passive:true});
  tick();
}

route();
</script>
</body>
</html>
