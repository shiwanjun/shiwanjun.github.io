<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<rect width="960" height="430" rx="18" fill="#FAF9F6"/>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;}</style>
<rect x="48" y="34" width="26" height="6" fill="#D9480F"/><text x="84" y="56" font-size="23" font-weight="700" fill="#1F2328">三个角色，一条流水线</text><rect x="48" y="108" width="154" height="140" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="66" y="142" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">01</text><text x="66" y="174" font-size="19" font-weight="700" fill="#1F2328">你说清目标</text><text x="66" y="204" font-size="13.5" fill="#4A545E">做什么、给谁看</text><text x="66" y="228" font-size="13.5" fill="#4A545E">要什么结果</text><line x1="204" y1="178" x2="214" y2="178" stroke="#D9480F" stroke-width="2"/><path d="M224 178 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="214.0" cy="178" r="0"/><rect x="226" y="108" width="154" height="140" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="244" y="142" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">02</text><text x="244" y="174" font-size="19" font-weight="700" fill="#1F2328">连接器取资料</text><text x="244" y="204" font-size="13.5" fill="#4A545E">素材在别的应用里</text><text x="244" y="228" font-size="13.5" fill="#4A545E">它负责取过来</text><line x1="382" y1="178" x2="392" y2="178" stroke="#D9480F" stroke-width="2"/><path d="M402 178 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="392.0" cy="178" r="0"/><rect x="404" y="108" width="154" height="140" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="422" y="142" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">03</text><text x="422" y="174" font-size="19" font-weight="700" fill="#1F2328">专家出主意</text><text x="422" y="204" font-size="13.5" fill="#4A545E">选题、结构、建议</text><line x1="560" y1="178" x2="570" y2="178" stroke="#D9480F" stroke-width="2"/><path d="M580 178 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="570.0" cy="178" r="0"/><rect x="582" y="108" width="154" height="140" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="600" y="142" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">04</text><text x="600" y="174" font-size="19" font-weight="700" fill="#1F2328">技能做成品</text><text x="600" y="204" font-size="13.5" fill="#4A545E">按格式出表格文档</text><line x1="738" y1="178" x2="748" y2="178" stroke="#D9480F" stroke-width="2"/><path d="M758 178 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="748.0" cy="178" r="0"/><rect x="760" y="108" width="154" height="140" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="778" y="142" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">05</text><text x="778" y="174" font-size="19" font-weight="700" fill="#1F2328">你验收</text><text x="778" y="204" font-size="13.5" fill="#4A545E">对照检查再使用</text><text x="48" y="300" font-size="15.5" fill="#4A545E">不必每次全员上场：只改几个字，直接说就行；</text><text x="48" y="326" font-size="15.5" fill="#4A545E">资料已经发在对话里，连接器这步也可以跳过。</text><text x="48" y="376" font-size="16.5" font-weight="700" fill="#D9480F">先想清楚要做什么，再挑能帮上忙的角色。</text></svg>