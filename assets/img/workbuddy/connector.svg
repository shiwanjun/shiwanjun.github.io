<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410">
<rect width="960" height="410" rx="18" fill="#FAF9F6"/>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;}</style>
<rect x="48" y="34" width="26" height="6" fill="#D9480F"/><text x="84" y="56" font-size="23" font-weight="700" fill="#1F2328">连接器：给助手开一扇有锁的门</text><rect x="48" y="112" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="66" y="178" font-size="19" font-weight="700" fill="#1F2328">外部应用</text><text x="66" y="208" font-size="13.5" fill="#4A545E">网盘 / 在线文档</text><text x="66" y="232" font-size="13.5" fill="#4A545E">你的素材放在这里</text><rect x="336" y="140" width="288" height="94" rx="16" fill="#FDEEE3" stroke="#D9480F" stroke-width="1.5"/><text x="480" y="178" font-size="19" font-weight="700" fill="#D9480F" text-anchor="middle">连接器</text><text x="480" y="206" font-size="13.5" fill="#4A545E" text-anchor="middle">在你授权的范围内访问</text><rect x="672" y="112" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="690" y="178" font-size="19" font-weight="700" fill="#1F2328">WorkBuddy</text><text x="690" y="208" font-size="13.5" fill="#4A545E">对话里直接使用</text><text x="690" y="232" font-size="13.5" fill="#4A545E">读到的资料</text><line x1="292" y1="187" x2="324" y2="187" stroke="#D9480F" stroke-width="2"/><path d="M334 187 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="313.0" cy="187" r="0"/><line x1="628" y1="187" x2="660" y2="187" stroke="#D9480F" stroke-width="2"/><path d="M670 187 l-11 -5.5 v11 z" fill="#D9480F"/><circle cx="649.0" cy="187" r="0"/><text x="48" y="322" font-size="15.5" fill="#4A545E">能读什么、能不能改，取决于它支持的操作——连接前把授权说明读完。</text><text x="48" y="350" font-size="15.5" fill="#4A545E">注意用资料所在的那个账号去连，连错账号什么都读不到。</text></svg>