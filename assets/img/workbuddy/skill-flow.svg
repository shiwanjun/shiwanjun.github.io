<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
<rect width="960" height="440" rx="18" fill="#FAF9F6"/>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;}</style>
<rect x="48" y="34" width="26" height="6" fill="#D9480F"/><text x="84" y="56" font-size="23" font-weight="700" fill="#1F2328">技能四步：找 → 装 → 用 → 验</text><rect x="48" y="104" width="202" height="120" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="66" y="138" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">01</text><text x="66" y="170" font-size="19" font-weight="700" fill="#1F2328">找</text><text x="66" y="200" font-size="13.5" fill="#4A545E">先定一个小目标</text><text x="66" y="224" font-size="13.5" fill="#4A545E">再按关键词搜索</text><rect x="274" y="104" width="202" height="120" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="292" y="138" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">02</text><text x="292" y="170" font-size="19" font-weight="700" fill="#1F2328">装</text><text x="292" y="200" font-size="13.5" fill="#4A545E">看清准备步骤</text><text x="292" y="224" font-size="13.5" fill="#4A545E">缺什么先补什么</text><rect x="500" y="104" width="202" height="120" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="518" y="138" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">03</text><text x="518" y="170" font-size="19" font-weight="700" fill="#1F2328">用</text><text x="518" y="200" font-size="13.5" fill="#4A545E">用小材料先跑一次</text><text x="518" y="224" font-size="13.5" fill="#4A545E">别一上来放大任务</text><rect x="726" y="104" width="202" height="120" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="744" y="138" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">04</text><text x="744" y="170" font-size="19" font-weight="700" fill="#1F2328">验</text><text x="744" y="200" font-size="13.5" fill="#4A545E">查执行记录</text><text x="744" y="224" font-size="13.5" fill="#4A545E">再查成果能不能用</text><rect x="48" y="270" width="864" height="86" rx="14" fill="#FDEEE3" stroke="#D9480F" stroke-width="1.5"/><text x="72" y="305" font-size="18" font-weight="700" fill="#D9480F">装了 ≠ 用了</text><text x="72" y="333" font-size="14.5" fill="#4A545E">普通对话也可能做出一张表。先在执行记录里确认技能真的参与，再检查成果。</text><text x="48" y="400" font-size="15.5" fill="#4A545E">一次把一个技能走通，比一次装十个都强。</text></svg>