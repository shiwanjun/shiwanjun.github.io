<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
<rect width="960" height="440" rx="18" fill="#FAF9F6"/>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;}</style>
<rect x="48" y="34" width="26" height="6" fill="#D9480F"/><text x="84" y="56" font-size="23" font-weight="700" fill="#1F2328">交付前，过一遍这五项</text><rect x="48" y="100" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#D9480F" stroke-width="2"/><text x="94" y="120" font-size="17.5" font-weight="700" fill="#1F2328">资料读全了吗</text><text x="330" y="120" font-size="14.5" fill="#7A828C">对照原文，逐项核对</text><rect x="48" y="156" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#D9480F" stroke-width="2"/><text x="94" y="176" font-size="17.5" font-weight="700" fill="#1F2328">方案能照做吗</text><text x="330" y="176" font-size="14.5" fill="#7A828C">把自己当新手走一遍</text><rect x="48" y="212" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#D9480F" stroke-width="2"/><text x="94" y="232" font-size="17.5" font-weight="700" fill="#1F2328">成果能用吗</text><text x="330" y="232" font-size="14.5" fill="#7A828C">文件要真的打开看过</text><rect x="48" y="268" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#D9480F" stroke-width="2"/><text x="94" y="288" font-size="17.5" font-weight="700" fill="#1F2328">缺的标了吗</text><text x="330" y="288" font-size="14.5" fill="#7A828C">「未提供 / 待确认」，别让它编</text><rect x="48" y="324" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#D9480F" stroke-width="2"/><text x="94" y="344" font-size="17.5" font-weight="700" fill="#1F2328">参与确认了吗</text><text x="330" y="344" font-size="14.5" fill="#7A828C">执行记录里找技能的名字</text><text x="48" y="404" font-size="16" font-weight="700" fill="#D9480F">五项都过，再把它当成品用。</text></svg>