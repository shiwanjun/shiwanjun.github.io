<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" rx="18" fill="#FAF9F6"/>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;}</style>
<rect x="48" y="34" width="26" height="6" fill="#D9480F"/><text x="84" y="56" font-size="23" font-weight="700" fill="#1F2328">把任务说清楚，就四件事</text><rect x="48" y="100" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="66" y="134" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">01</text><text x="66" y="166" font-size="19" font-weight="700" fill="#1F2328">做什么</text><text x="66" y="196" font-size="13.5" fill="#4A545E">想一份周末出游</text><text x="66" y="220" font-size="13.5" fill="#4A545E">攻略</text><rect x="278" y="100" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="296" y="134" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">02</text><text x="296" y="166" font-size="19" font-weight="700" fill="#1F2328">给谁看</text><text x="296" y="196" font-size="13.5" fill="#4A545E">两个大人</text><text x="296" y="220" font-size="13.5" fill="#4A545E">带一个五岁的娃</text><rect x="508" y="100" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="526" y="134" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">03</text><text x="526" y="166" font-size="19" font-weight="700" fill="#1F2328">有什么材料</text><text x="526" y="196" font-size="13.5" fill="#4A545E">收藏夹里 6 个</text><text x="526" y="220" font-size="13.5" fill="#4A545E">景点链接</text><rect x="738" y="100" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#E6E4DE" stroke-width="1.5"/><text x="756" y="134" font-size="15" font-weight="700" fill="#D9480F" font-family="ui-monospace,Menlo,monospace">04</text><text x="756" y="166" font-size="19" font-weight="700" fill="#1F2328">要什么结果</text><text x="756" y="196" font-size="13.5" fill="#4A545E">先出一张</text><text x="756" y="220" font-size="13.5" fill="#4A545E">两天行程表</text><text x="48" y="308" font-size="15.5" fill="#4A545E">四个空一填，任务就具体了——</text><text x="48" y="334" font-size="16.5" font-weight="700" fill="#D9480F">比一句「帮我写个攻略」有用得多。</text></svg>